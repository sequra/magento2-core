name: Unit tests

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up the environment
        env:
          M2_COMPOSER_REPO_KEY: ${{ secrets.M2_COMPOSER_REPO_KEY }}
          M2_COMPOSER_REPO_SECRET: ${{ secrets.M2_COMPOSER_REPO_SECRET }}
        run: |
          cp .env.sample .env
          sed -i "s/^M2_SAMPLE_DATA=.*/#M2_SAMPLE_DATA=&/" .env
          for key in M2_COMPOSER_REPO_KEY M2_COMPOSER_REPO_SECRET; do
            sed -i "s|^$key=.*|$key=${!key}|" .env
          done
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u sequra --password-stdin || (echo "❌ Can't log in to the GitHub Container Registry" && exit 1)
          ./setup.sh

      - name: Install the module from this checkout
        run: ./bin/update-sequra

      - name: PHPUnit
        run: ./bin/phpunit

      - name: Tear down the environment
        if: always()
        run: ./teardown.sh
