name: E2E tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**'
      - '!**.md'
      - '!.claude/**'
      - '!.githooks/**'
      - '!.github/**'
      - '.github/workflows/e2e-tests.yml'
      - '!Test/**'
      - '!phpstan.neon'
      - '!.phpcs.xml.dist'

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tunnel:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
    steps:
      - name: Check the tunnel secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
          TUNNEL_DOMAIN: ${{ vars.E2E_TUNNEL_DOMAIN || secrets.E2E_TUNNEL_DOMAIN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$TUNNEL_DOMAIN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E tests skipped: set the E2E_CLOUDFLARE_API_TOKEN and E2E_CLOUDFLARE_ACCOUNT_ID secrets and E2E_TUNNEL_DOMAIN to run them."
          fi

  e2e-tests:
    needs: tunnel
    if: needs.tunnel.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      E2E_HOST: magento2-core-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}.${{ vars.E2E_TUNNEL_DOMAIN || secrets.E2E_TUNNEL_DOMAIN }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          npm ci --no-audit --no-fund --no-progress

      - name: Open the tunnel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cp .env.sample .env
          bin/e2e-tunnel up "$E2E_HOST"

      - name: Set up the environment
        env:
          M2_COMPOSER_REPO_KEY: ${{ secrets.M2_COMPOSER_REPO_KEY }}
          M2_COMPOSER_REPO_SECRET: ${{ secrets.M2_COMPOSER_REPO_SECRET }}
        run: |
          playwright_image=$(grep -o 'mcr.microsoft.com/playwright:[^ ]*' bin/playwright)
          docker pull --quiet "$playwright_image" > /dev/null &
          playwright_pull=$!
          for key in M2_COMPOSER_REPO_KEY M2_COMPOSER_REPO_SECRET; do
            sed -i "s|^$key=.*|$key=${!key}|" .env
          done
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u sequra --password-stdin || (echo "❌ Can't log in to the GitHub Container Registry" && exit 1)
          ./setup.sh --cloudflared
          wait "$playwright_pull"

      - name: Run the E2E tests
        run: ./bin/playwright

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          docker compose logs --no-color magento > diagnostics/magento.log 2>&1 || true
          set -a; source .env; set +a
          docker logs "${CLOUDFLARED_CONTAINER_NAME:-magento-cloudflared}" > diagnostics/cloudflared.log 2>&1 || true
          docker compose exec -T magento sh -c 'tail -n 500 var/log/*.log' > diagnostics/magento-var-log.txt 2>&1 || true

      - name: Upload the test results and diagnostics
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-failure
          path: |
            test-results
            diagnostics
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down the environment
        if: always()
        run: ./teardown.sh

      - name: Close the tunnel
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.E2E_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.E2E_CLOUDFLARE_ACCOUNT_ID }}
        run: bin/e2e-tunnel down "$E2E_HOST"
